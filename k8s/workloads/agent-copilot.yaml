apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-copilot
  namespace: agents
---
# spiffe-helper config (HCL). One JWT-SVID is minted per (audience, file) row.
# This SVID is presented as the `actor_token` in the RFC 8693 token exchange.
# Add more rows if other SVID audiences come into play.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-copilot-spiffe-helper
  namespace: agents
data:
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cmd = ""
    cmd_args = ""
    daemon_mode = true
    jwt_svids = [
      {
        jwt_audience = "https://curity.localtest.me/oauth/v2/oauth-token"
        jwt_svid_file_name = "/run/spiffe/curity-actor.jwt"
      }
    ]
---
# NOTE: agent-copilot no longer holds an LLM API key or endpoint. LLM calls
# are routed through the agentgateway `/llm` route (identity-bound egress):
# the agent exchanges the caller's user token for an aud=llm-gateway,
# scope=llm:invoke token (RFC 8693, actor = this agent's SPIFFE JWT-SVID) and
# presents it as the bearer to the gateway, which swaps in the real upstream
# API key before forwarding. See llm-token.ts / packages/agent-runtime/llm.ts.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-copilot
  namespace: agents
  labels:
    app: agent-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-copilot
  template:
    metadata:
      labels:
        app: agent-copilot
    spec:
      serviceAccountName: agent-copilot
      volumes:
        # CSI mount exposing the SPIRE agent's workload-API socket.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # In-memory tmpfs shared between the helper (writer) and the main
        # container (reader). SVIDs never touch disk.
        - name: spiffe-svids
          emptyDir:
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: agent-copilot-spiffe-helper
      containers:
        - name: agent
          image: ai-agents-demo/agent-copilot:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: spiffe-svids
              mountPath: /run/spiffe
              readOnly: true
          env:
            - name: PORT
              value: "8081"
            - name: CURITY_ISSUER
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous
            - name: CURITY_JWKS_URI
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous/jwks
            - name: AGENT_AUDIENCE
              value: agent-copilot
            - name: MCP_OBSERVABILITY_URL
              # The agentgateway MCP front door, by its PUBLIC name. The agent is a
              # spec-shaped MCP client: it learns the authorization server from this
              # URL's 401 → RFC 9728 → RFC 8414 chain, and RFC 9728 requires the
              # document's `resource` to equal the URL the client uses — which is why
              # this is the edge host (scripts/cluster-routing.sh aliases it into the
              # pod) and not the in-cluster Service name. The gateway validates
              # aud=mcp-gateway, applies per-tool CEL RBAC, and re-exchanges (via the
              # co-located exchange-shim) to a narrowed aud=mcp-observability token
              # before forwarding to the origin. The authoritative JWT + act-chain
              # enforcement still lives in the MCP middleware
              # (apps/mcp-observability/src/auth-middleware.ts).
              value: https://mcp-gateway.localtest.me/observability/mcp
            # CIMD client_id — the HTTPS URL Curity dereferences for this agent's
            # metadata document. Must match the CLIENT_POLICY key in token-exchange.js.
            - name: AGENT_CLIENT_ID
              value: https://copilot.localtest.me/.well-known/oauth-client
            # The one static per-server value: the RFC 8693 audience (logical name).
            # Replaced by RFC 8707 resource once Curity supports it. The gateway
            # narrows to mcp-observability per tool.
            - name: MCP_OBSERVABILITY_AUDIENCE
              value: mcp-gateway
            # A2A privileged-path target.
            - name: SPECIALIST_A2A_URL
              value: http://agent-specialist.agents.svc.cluster.local:8082/a2a
            - name: SPECIALIST_AUDIENCE
              value: agent-specialist
            - name: SPECIALIST_SCOPE
              value: obs:read ops:write llm:invoke
            # Identity-bound LLM egress: routed through the agentgateway `/llm`
            # route (mcp ns). The agent exchanges the caller's user token for an
            # aud=llm-gateway, scope=llm:invoke token (RFC 8693) and presents it
            # as the bearer; the gateway swaps in the real upstream API key
            # before forwarding. See llm-token.ts.
            - name: LLM_GATEWAY_URL
              value: http://agentgateway.mcp.svc.cluster.local:8080/llm
            - name: LLM_GATEWAY_AUDIENCE
              value: llm-gateway
            - name: LLM_GATEWAY_SCOPE
              value: llm:invoke
            # OTel: export to the Collector (OTLP/HTTP); spiffe.id read from the
            # SVID file at SPIFFE_SVID_PATH by otel-bootstrap at SDK init.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: agent-copilot
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agents
            - name: SPIFFE_SVID_PATH
              value: /run/spiffe/curity-actor.jwt
          envFrom:
            - secretRef:
                name: agent-copilot-curity
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe-helper/spiffe-helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-svids
              mountPath: /run/spiffe
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          # Run as UID 1000 to match the `node` user in the main container's
          # node:22-bookworm-slim base image. spiffe-helper's older releases
          # write SVID files with mode 0600 (owner-only) and lack a file-mode
          # config knob, so matching UIDs is the simplest path to letting the
          # main container read its own SVID.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: agent-copilot
  namespace: agents
spec:
  selector:
    app: agent-copilot
  ports:
    - name: http
      port: 8081
      targetPort: 8081
