# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway config — path-routed MCP front door for mcp-inspect +
# mcp-ops, plus the governed /llm egress. Validated against agentgateway v1.7.0.
#
# Why path-routed instead of one federated /mcp endpoint: the OBO hop (extAuthz →
# exchange-shim) mints ONE audience-scoped token and the gateway swaps ONE
# `authorization` header per request, but a federated `tools/list` fans out to
# BOTH backends inside a single request — one request cannot carry two tokens.
# So each backend gets its own route with a STATIC x-target-audience; callers
# pick the path. (Until v1.5.0 there was a second reason: the `mcp` CEL context
# was `None` inside route-level policies. Since v1.6.0 — PR #3301 — the gateway
# parses the tools/call body BEFORE route policies run, so `mcp.tool.name`,
# `mcp.tool.target` and `mcp.tool.arguments.*` DO resolve in `extAuthz` and
# `authorization`; the rules below rely on it. The one-token-per-request
# constraint still stands.)
#
# YAML foot-gun: an unquoted CEL ternary `A ? B : C` parses as a YAML complex
# mapping key and fails as "expected a string" — keep all CEL single-quoted.
#
# Deployment: mounted into the agentgateway pod, run with `agentgateway --file`.
# The exchange-shim runs co-located (same pod, localhost:8090) — see
# apps/exchange-shim. JWKS uses the plain-HTTP in-cluster Service URL because
# pods cannot resolve curity.localtest.me (CLAUDE.md facts #5/#21).

# DNS resolver tuning for external egress (the /llm azure backend).
# agentgateway's Rust (hickory) resolver otherwise fails to resolve the public
# Azure host with "DNS resolution which failed" (NoHealthyBackend/503), while
# glibc/Node in the same cluster resolves it fine. Two observed causes:
#   - The Azure host has NO AAAA record (ENODATA); the default lookup family
#     queries IPv6 too. This cluster is all-IPv4 → force V4Only.
#   - The A answer is a CNAME chain + several records that overflows the 512-byte
#     UDP limit; without EDNS0 the response is truncated and the resolver fails
#     to recover. edns0 advertises a larger UDP buffer so CoreDNS returns it whole.
config:
  dns:
    lookupFamily: V4Only
    edns0: true
  # Native OTLP tracing. Without it the gateway is a HOLE in every trace: it
  # generates a span per request (it logs `trace.id`/`span.id`) and propagates
  # that context downstream, but exports nothing — so the hop that authorizes the
  # call and re-mints the token is invisible, which is the one hop these traces
  # exist to show. With it you also get `mcp.method.name` / `mcp.target` /
  # `gen_ai.tool.name`, and the full `gen_ai.usage.*` token accounting on /llm —
  # available nowhere else.
  # grpc/4317 (the collector exposes 4317 gRPC and 4318 HTTP; the Node services
  # use the latter).
  tracing:
    otlpEndpoint: http://otel-collector.telemetry.svc.cluster.local:4317
    otlpProtocol: grpc
    # The gateway span already carries `http.path`, `route` and `http.host`, plus
    # `endpoint` (upstream host:port) for plain HTTP backends like /llm. It does
    # NOT set `endpoint` for the two MCP routes, because those use a named-target
    # `mcp:` backend rather than a single address — there `mcp.target` names the
    # backend logically instead. Add the absolute URL under the standard semconv
    # key so a gateway span states its endpoint the same way every Node span does.
    # (VERIFIED to resolve: request.uri / request.path / request.method /
    # request.host. `backend` and `route` do NOT resolve as CEL roots here, and
    # --validate-only does not check CEL, so an unknown root silently yields
    # nothing rather than erroring.)
    #
    # The two inputs the `authorization` rules read are recorded on every span that
    # has them. That is what names the tool on a DENIED call: the HTTP-layer
    # `authorization` policy refuses it before the MCP layer runs, so that span is
    # a generic `POST /ops/mcp/*` — these fields are the record of what was refused
    # and of the namespace that tripped the prod-only rule. They read the buffered
    # JSON-RPC body (the same source the rules evaluate), not client headers, so
    # they state what was actually asked for. NOT `mcp.tool.name`: log-time CEL
    # gets `mcp` from the MCP handler (`log.mcp_status`), which never runs on an
    # HTTP-layer denial, so that path is empty on exactly the span that matters
    # (measured 2026-10-29). Absent (the /llm route, `tools/list`) → the field is
    # omitted, not emptied.
    fields:
      add:
        url.full: 'request.uri'
        mcp.tool.name: 'json(request.body).params.name'
        mcp.tool.arguments.namespace: 'json(request.body).params.arguments.namespace'

binds:
- port: 8080
  listeners:
  - name: mcp
    protocol: HTTP
    routes:

    # ------------------------------------------------------------------ #
    # Inspect backend  ->  GET/POST {gateway}:8080/inspect/mcp
    # Read-only tools: list_pods, get_pod_logs, get_deployment.
    # Audience narrowed to mcp-inspect; the shim maps that audience to
    # the inspect:read scope from its own allow-list (never a caller-supplied scope).
    # ------------------------------------------------------------------ #
    - name: inspect
      matches:
      - path:
          pathPrefix: /inspect/mcp
      # RFC 9728: the gateway only SERVES the protected-resource document for a
      # request that matched this route (mcp/auth.rs `apply_token_validation`
      # short-circuits on the well-known path, but routing happens first), so the
      # well-known path must be matched here too. Without this the 401 below
      # advertises a URL that answers 404 "route not found" — a dangling pointer
      # that any spec-shaped client fails closed on.
      - path:
          exact: /.well-known/oauth-protected-resource/inspect/mcp
      policies:
        # RFC 9449: the agents present a DPoP-bound token as `Authorization: DPoP …`;
        # unbound tokens (MCP Inspector, smoke scripts) still come as Bearer. Only the
        # header is parsed here — agentgateway verifies no proof; the shim does.
        mcpAuthentication:
          authorizationLocation:
            expression: 'request.headers["authorization"].startsWith("DPoP ") ? request.headers["authorization"].stripPrefix("DPoP ") : request.headers["authorization"].stripPrefix("Bearer ")'
          issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
          audiences:
          - mcp-gateway
          jwks:
            url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
          resourceMetadata:
            resource: https://mcp-gateway.localtest.me/inspect/mcp
            # agentgateway hard-codes an informational `mcp_protocol_version: 2025-06-18`
            # into the document (not an RFC 9728 field); configured keys win, so state
            # the revision this gateway actually negotiates (fact #26).
            mcpProtocolVersion: "2026-07-28"
            scopesSupported:
            - inspect:read
            bearerMethodsSupported:
            - header
            # RFC 9728 §2: the proof algorithms this resource accepts (ES256 is what the agents sign).
            dpopSigningAlgValuesSupported:
            - ES256
            - ES384
            - RS256
            - PS256
            - EdDSA
        # Read tier: inspect:read required for every inspect tool (mirrors the
        # ops tier's ops:write invariant). Reads are unprivileged — no role gate.
        mcpAuthorization:
          rules:
          - '"inspect:read" in (jwt.scope.split(" ")) && mcp.tool.name in ["list_pods", "get_pod_logs", "get_deployment"]'
        # Namespace confinement, same construction as the ops route: the gateway
        # parses the tools/call body before route policies run (v1.6.0+, PR #3301),
        # so the rule reads the ACTUAL `namespace` argument — not a client-sent
        # header a caller could set to disagree with the body. A cross-namespace
        # read (e.g. pod logs from kube-system) is refused here rather than relying
        # solely on inspect-api's RBAC. `has()` makes it "present AND not prod", so
        # omitting the argument — the common case, since the server defaults it —
        # never trips the rule.
        authorization:
          rules:
          - deny: 'has(mcp.tool.arguments.namespace) && mcp.tool.arguments.namespace != "prod"'
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                # Original caller bearer. Must come from jwt.rawToken.unredacted():
                # the JWT auth layer strips request.headers["authorization"] before
                # extAuthz runs (VERIFIED). The shim strips the "Bearer " prefix.
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                # Static per-route audience (see header: mcp.* is unavailable here).
                # The shim derives the scope from this audience; NO x-target-scope.
                x-target-audience: '"mcp-inspect"'
                # RFC 9449 inputs for the shim, which enforces DPoP for a bound token: the
                # proof (undefined → omitted), the method, and this route's PUBLIC URL —
                # static, like the audience, so a caller cannot choose what it is checked against.
                x-dpop-proof: 'request.headers["dpop"]'
                x-dpop-htm: 'request.method'
                x-dpop-htu: '"https://mcp-gateway.localtest.me/inspect/mcp"'
                # W3C trace context for the extAuthz callout. agentgateway v1.4.x
                # did not propagate to extAuthz on its own, so forward it explicitly.
                # (v1.5.0 injects its own `ExtAuthz` client span into the callout,
                # which supersedes this value; kept because it is harmless.)
                # VERIFIED by echoing the callout's headers: at this point
                # `request.headers["traceparent"]` is NOT the caller's value — the
                # gateway has already rewritten it to its OWN span
                # (httpproxy.rs `tp.new_span()` + `insert_header`, applied at the
                # listener stage before route policies run). So the shim's
                # auth.token_exchange span — the hop that inserts agentgateway
                # into the downstream `act` chain — nests directly under the
                # gateway span, which is exactly where it belongs.
                traceparent: 'request.headers["traceparent"]'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
            # The proof was for the gateway; the MCP server never sees it.
            remove:
            - dpop
      backends:
      - mcp:
          targets:
          - name: inspect
            mcp:
              host: mcp-inspect.mcp.svc.cluster.local
              port: 8080
              path: /mcp

    # ------------------------------------------------------------------ #
    # Ops backend  ->  GET/POST {gateway}:8080/ops/mcp
    # Write tools: restart_deployment, scale_deployment (safe writes) and the
    # SHOWCASE tool set_deployment_image (privileged). Audience narrowed to
    # mcp-ops -> shim maps to ops:write scope.
    # ------------------------------------------------------------------ #
    - name: ops
      matches:
      - path:
          pathPrefix: /ops/mcp
      # RFC 9728 well-known path — see the inspect route for why.
      - path:
          exact: /.well-known/oauth-protected-resource/ops/mcp
      policies:
        # Bearer or DPoP scheme (see the inspect route).
        mcpAuthentication:
          authorizationLocation:
            expression: 'request.headers["authorization"].startsWith("DPoP ") ? request.headers["authorization"].stripPrefix("DPoP ") : request.headers["authorization"].stripPrefix("Bearer ")'
          issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
          audiences:
          - mcp-gateway
          jwks:
            url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
          resourceMetadata:
            resource: https://mcp-gateway.localtest.me/ops/mcp
            # agentgateway hard-codes an informational `mcp_protocol_version: 2025-06-18`
            # into the document (not an RFC 9728 field); configured keys win, so state
            # the revision this gateway actually negotiates (fact #26).
            mcpProtocolVersion: "2026-07-28"
            scopesSupported:
            - ops:write
            bearerMethodsSupported:
            - header
            # RFC 9728 §2: the proof algorithms this resource accepts (ES256 is what the agents sign).
            dpopSigningAlgValuesSupported:
            - ES256
            - ES384
            - RS256
            - PS256
            - EdDSA
            # NON-STANDARD, demo-local (RFC 9470 step-up): the ACR this tier needs.
            # agentgateway flattens extra keys into the document and snake_cases
            # them (types/agent.rs ResourceMetadata::to_rfc_json), so this becomes
            # `acr_values_supported`. Mirrors mcp-ops's own PRM; the specialist's
            # step-up challenge is built from THIS document now.
            acrValuesSupported:
            - mfa
        # Tier gate: ops:write is required for every ops tool. The Curity exchange
        # already requires a WRITE role (sre OR oncall) to issue ops:write, so every
        # caller reaching this route holds one.
        #
        # NOTE this is `mcpAuthorization` (the MCP layer), where a denial ALSO hides
        # the tool from tools/list — agentgateway couples visibility to call-authz.
        # That is why the per-tool role split is NOT expressed here: hiding
        # set_deployment_image from an oncall caller would make its LLM never attempt
        # the tool (a silent no-op instead of a legible denial). The split lives in
        # the `authorization` policy below, which is the HTTP layer and does not
        # participate in tools/list filtering.
        mcpAuthorization:
          rules:
          - '"ops:write" in (jwt.scope.split(" ")) && mcp.tool.name in ["restart_deployment", "scale_deployment", "set_deployment_image"]'
        # Per-tool role split: set_deployment_image requires the `sre` role.
        #
        # Why HERE and not in mcpAuthorization above: `authorization` is an
        # HTTP-layer policy (crates/agentgateway/src/http/authorization.rs, applied
        # via Executor::new_request). It never runs in the MCP tools/list path, so a
        # denial refuses the CALL while leaving the tool VISIBLE — exactly what the
        # MCP-layer policy cannot do.
        #
        # ORDERING (measured, 2026-08-05, v1.4.1): for ROUTE-level policies extAuthz
        # runs BEFORE authorization, so a denied tool-call still performs the OBO
        # exchange — a privileged aud=mcp-ops token IS minted and then discarded
        # unused. Do not read httpproxy.rs and conclude otherwise: it has three
        # policy application sites with DIFFERENT orders (the backend-level site does
        # run authorization first). Verified by counting exchange-shim EXCHANGE lines:
        # connect-only = 1, connect + denied call = 2. Consequence: the deny stops the
        # request reaching mcp-ops, but it is not a way to avoid minting the token.
        #
        # Keyed on `mcp.tool.name`, which the gateway parses from the JSON-RPC body
        # BEFORE route policies run (v1.6.0+, PR #3301). Until v1.5.0 `mcp` was None
        # here and the rule read the client-sent `Mcp-Name` header instead — which a
        # caller could set to disagree with the body. `mcp.tool.name` is the resolved
        # upstream name (`set_deployment_image`, never the multiplexed `ops_…` form).
        #
        # Deny-only ⇒ denylist semantics: with no `allow` rules present, every other
        # request is unaffected (agentgateway defaults to allow unless an allow rule
        # exists but does not match). tools/list and server/discover carry no tool,
        # so `mcp.tool.name` does not resolve and this rule never matches.
        #
        # mcp-ops REMAINS AUTHORITATIVE — this is a first line, not the only one. If
        # the `roles` claim were ever absent the expression cannot evaluate true and
        # the deny fails open, so the downstream check in mcp-ops
        # (`Config.toolRequiredRoles['set_deployment_image']`, apps/mcp-ops/src/mcp.ts
        # `toolRoleDenial`) is what makes the split unconditional. Those two MUST
        # agree: change the role here and in TOOL_REQUIRED_ROLES together. mcp-ops's
        # matrix also lists restart/scale (= any write role, mirroring Curity's
        # ops:write gate) so every ops tool publishes its rule in tools/list _meta;
        # there is deliberately NO gateway rule for those — Curity already decided.
        #
        # The second rule is namespace confinement. It reads the ACTUAL `namespace`
        # argument (`mcp.tool.arguments.namespace`), so the gateway rejects a
        # cross-namespace write at the front door instead of relying solely on
        # ops-api's RBAC. `has()` makes it "present AND not prod", so OMITTING the
        # argument (the common case — the server defaults it) never trips the rule.
        # Keep 'prod' in step with TARGET_NAMESPACE on mcp-ops/ops-api.
        authorization:
          rules:
          - deny: 'mcp.tool.name == "set_deployment_image" && !("sre" in jwt.roles)'
          - deny: 'has(mcp.tool.arguments.namespace) && mcp.tool.arguments.namespace != "prod"'
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                x-target-audience: '"mcp-ops"'
                x-dpop-proof: 'request.headers["dpop"]'
                x-dpop-htm: 'request.method'
                x-dpop-htu: '"https://mcp-gateway.localtest.me/ops/mcp"'
                # W3C trace context for the extAuthz callout. agentgateway v1.4.x
                # did not propagate to extAuthz on its own, so forward it explicitly.
                # (v1.5.0 injects its own `ExtAuthz` client span into the callout,
                # which supersedes this value; kept because it is harmless.)
                # VERIFIED by echoing the callout's headers: at this point
                # `request.headers["traceparent"]` is NOT the caller's value — the
                # gateway has already rewritten it to its OWN span
                # (httpproxy.rs `tp.new_span()` + `insert_header`, applied at the
                # listener stage before route policies run). So the shim's
                # auth.token_exchange span — the hop that inserts agentgateway
                # into the downstream `act` chain — nests directly under the
                # gateway span, which is exactly where it belongs.
                traceparent: 'request.headers["traceparent"]'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
            # The proof was for the gateway; the MCP server never sees it.
            remove:
            - dpop
      backends:
      - mcp:
          targets:
          - name: ops
            mcp:
              host: mcp-ops.mcp.svc.cluster.local
              port: 8080
              path: /mcp

    # ------------------------------------------------------------------ #
    # LLM egress -> {gateway}:8080/llm  (OpenAI-compatible)
    # Identity-bound reasoning hop. jwtAuth(aud=llm-gateway) + require llm:invoke;
    # the gateway holds the ONLY upstream provider key (backendAuth.key). No shim,
    # no act-chain: the LLM vendor is outside the Curity trust domain — a single
    # upstream credential swap.
    #
    # Everything between the sentinels below is GENERATED from
    # k8s/workloads/llm-providers/<LLM_PROVIDER>.yaml by
    # scripts/render-gateway-config.sh, into .gen/agentgateway-config.yaml.
    # Edit the fragment, not this block. The jwtAuth and authorization policies
    # sit OUTSIDE the sentinels on purpose: the authorization posture of this hop
    # must not vary with the provider.
    # ------------------------------------------------------------------ #
    - name: llm
      matches:
      - path:
          pathPrefix: /llm
      policies:
        jwtAuth:
          providers:
          - issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
            audiences:
            - llm-gateway
            jwks:
              url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
        authorization:
          rules:
          - require: '"llm:invoke" in (jwt.scope.split(" "))'
        # BEGIN_LLM_PROVIDER
        backendAuth:
          key:
            value: $LLM_API_KEY
      backends:
      - ai:
          name: llm
          provider:
            openAI:
              model: gpt-4.1
        # END_LLM_PROVIDER

    # ------------------------------------------------------------------ #
    # DEMO-ONLY chain-visualization passthroughs (NOT part of the enforcement
    # path). The web UI walks the OBO chain by recursively calling each service's
    # /last-token. Since the agents now reach the MCP servers only THROUGH this
    # gateway, these plain-HTTP routes proxy
    #   {gateway}/inspect/last-token → mcp-inspect:8080/last-token
    #   {gateway}/ops/last-token           → mcp-ops:8080/last-token
    # through the SAME extAuthz→shim exchange as the /mcp routes, so the caller's
    # aud=mcp-gateway token is narrowed to aud=mcp-inspect / aud=mcp-ops —
    # the audience each /last-token endpoint verifies. urlRewrite strips the
    # /inspect|/ops prefix so the origin sees plain /last-token.
    # ------------------------------------------------------------------ #
    - name: inspect-last-token
      matches:
      - path:
          pathPrefix: /inspect/last-token
      policies:
        # Bearer or DPoP scheme, as on the /mcp routes: the agents' chain walk sends
        # the same DPoP-bound token here.
        jwtAuth:
          location:
            expression: 'request.headers["authorization"].startsWith("DPoP ") ? request.headers["authorization"].stripPrefix("DPoP ") : request.headers["authorization"].stripPrefix("Bearer ")'
          providers:
          - issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
            audiences:
            - mcp-gateway
            jwks:
              url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                x-target-audience: '"mcp-inspect"'
                x-dpop-proof: 'request.headers["dpop"]'
                x-dpop-htm: 'request.method'
                x-dpop-htu: '"https://mcp-gateway.localtest.me/inspect/last-token"'
                # W3C trace context for the extAuthz callout. agentgateway v1.4.x
                # did not propagate to extAuthz on its own, so forward it explicitly.
                # (v1.5.0 injects its own `ExtAuthz` client span into the callout,
                # which supersedes this value; kept because it is harmless.)
                # VERIFIED by echoing the callout's headers: at this point
                # `request.headers["traceparent"]` is NOT the caller's value — the
                # gateway has already rewritten it to its OWN span
                # (httpproxy.rs `tp.new_span()` + `insert_header`, applied at the
                # listener stage before route policies run). So the shim's
                # auth.token_exchange span — the hop that inserts agentgateway
                # into the downstream `act` chain — nests directly under the
                # gateway span, which is exactly where it belongs.
                traceparent: 'request.headers["traceparent"]'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
            # The proof was for the gateway; the MCP server never sees it.
            remove:
            - dpop
        urlRewrite:
          path:
            full: /last-token
      backends:
      - host: mcp-inspect.mcp.svc.cluster.local:8080

    - name: ops-last-token
      matches:
      - path:
          pathPrefix: /ops/last-token
      policies:
        # Bearer or DPoP scheme, as on the /mcp routes: the agents' chain walk sends
        # the same DPoP-bound token here.
        jwtAuth:
          location:
            expression: 'request.headers["authorization"].startsWith("DPoP ") ? request.headers["authorization"].stripPrefix("DPoP ") : request.headers["authorization"].stripPrefix("Bearer ")'
          providers:
          - issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
            audiences:
            - mcp-gateway
            jwks:
              url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                x-target-audience: '"mcp-ops"'
                x-dpop-proof: 'request.headers["dpop"]'
                x-dpop-htm: 'request.method'
                x-dpop-htu: '"https://mcp-gateway.localtest.me/ops/last-token"'
                # W3C trace context for the extAuthz callout. agentgateway v1.4.x
                # did not propagate to extAuthz on its own, so forward it explicitly.
                # (v1.5.0 injects its own `ExtAuthz` client span into the callout,
                # which supersedes this value; kept because it is harmless.)
                # VERIFIED by echoing the callout's headers: at this point
                # `request.headers["traceparent"]` is NOT the caller's value — the
                # gateway has already rewritten it to its OWN span
                # (httpproxy.rs `tp.new_span()` + `insert_header`, applied at the
                # listener stage before route policies run). So the shim's
                # auth.token_exchange span — the hop that inserts agentgateway
                # into the downstream `act` chain — nests directly under the
                # gateway span, which is exactly where it belongs.
                traceparent: 'request.headers["traceparent"]'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
            # The proof was for the gateway; the MCP server never sees it.
            remove:
            - dpop
        urlRewrite:
          path:
            full: /last-token
      backends:
      - host: mcp-ops.mcp.svc.cluster.local:8080

    # ------------------------------------------------------------------ #
    # Workload-identity readout for the web "Workload identities" panel.
    # Unlike the agents/MCP servers, agentgateway is a Rust binary with no
    # /spiffe-id of its own — but the co-located exchange-shim reads the SAME
    # rotating SVID the gateway presents as its actor_token, so the shim's
    # /spiffe-id IS agentgateway's workload identity. Plain read-only proxy:
    # NO jwtAuth / extAuthz / rewrite (identity claims aren't secret, same as
    # the other /spiffe-id endpoints). This route deliberately exposes ONLY
    # /spiffe-id from the shim — the token-exchange /exchange endpoint has no
    # route and therefore never reaches the Service.
    # ------------------------------------------------------------------ #
    - name: gateway-spiffe-id
      matches:
      - path:
          pathPrefix: /spiffe-id
      backends:
      - host: localhost:8090
