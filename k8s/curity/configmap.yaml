              <password>data:text/plain;aes,v:S.R25mSG53d0xXNkhteVJOZA==.SEjbvqoYY85prZ_TbWyIPw==.sYiSoYSIRCXQqpNhNYGekQ==.QMDC6Jq7YQBht6sXIIxcSHiiCq3Zw3S7r6Y3xf66lPA=</password>
              <username>SA</username>
            </jdbc>
          </data-source>
        </data-sources>
        <crypto>
