# KIND cluster for the AI agent demo.
# Single control-plane node with extraPortMappings so the Istio ingress
# gateway can serve 80/443 on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-agents-demo
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
