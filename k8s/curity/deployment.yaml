apiVersion: v1
kind: ServiceAccount
metadata:
  name: curity
  namespace: curity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curity
  namespace: curity
  labels:
    app: curity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curity
  template:
    metadata:
      labels:
        app: curity
    spec:
      serviceAccountName: curity
      # The idsvr image runs as idsvr (uid 10001, gid 10000); an emptyDir is root-owned,
      # so without fsGroup the init container cannot write the seeded DB into it.
      securityContext:
        fsGroup: 10000
      # Seed alice/bob/carol (+ TOTP) into the file-based HSQLDB BEFORE idsvr opens it.
      # The image ships a pristine schema-complete DB at /opt/idsvr/var/db; the init
      # container copies it into the `db` emptyDir, INSERTs the persona rows with the
      # bundled hsqltool, and exits. Inputs come from the curity-demo-users Secret
      # (`make seed-users`); the script from the curity-users-init-script ConfigMap
      # (`make apply`, from scripts/curity-users-init.sh). Same image → same uid, so
      # the files are owned by idsvr. A restart re-runs it with the SAME secrets.
      initContainers:
        - name: seed-users
          image: curity.azurecr.io/curity/idsvr:11.5.1@sha256:ec305e379f26d7f42486dad82ef32b6a16d82408ba9c1d00f143f584a259051d
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/curity-users-init.sh"]
          envFrom:
            - secretRef:
                name: curity-demo-users
          volumeMounts:
            - name: db
              mountPath: /seed
            - name: seed-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: idsvr
          # PINNED, deliberately (and the init container above must match).
          # 11.5+ refuses to fetch a CIMD client_id that resolves to a private
          # address; in-cluster the agent hosts resolve to the istio-ingress
          # ClusterIP, so the configmap's <ephemeral-client> MUST carry
          # <allowed-address-ranges> (else every agent exchange fails
          # `invalid_client "... is a special-use address"`). 11.5.1 is the first
          # release whose Admin UI renders the ephemeral-client page with that
          # leaf set. Pre-11.5 images have no such leaf - ConfD would refuse the
          # whole config - so do not roll back below 11.5.1 without removing it.
          # The digest (multi-arch index) is included because tags can be
          # rebuilt in place; change tag and digest together.
          # Public images are not freely pullable; check Curity's docs for access.
          image: curity.azurecr.io/curity/idsvr:11.5.1@sha256:ec305e379f26d7f42486dad82ef32b6a16d82408ba9c1d00f143f584a259051d
          imagePullPolicy: IfNotPresent
          ports:
            - name: admin
              containerPort: 6749
            - name: oauth
              containerPort: 8443
          env:
            - name: ADMIN
              value: "true"
            - name: LOGGING_LEVEL
              value: DEBUG
          volumeMounts:
            - name: db
              mountPath: /opt/idsvr/var/db
            - name: config
              mountPath: /opt/idsvr/etc/init/curity-config.xml
              subPath: curity-config.xml
              readOnly: true
            - name: license
              mountPath: /opt/idsvr/etc/init/license/license.json
              subPath: license.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: db
          emptyDir: {}
        - name: seed-script
          configMap:
            name: curity-users-init-script
        - name: config
          configMap:
            name: curity-config
        - name: license
          secret:
            secretName: curity-license
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: curity
  namespace: curity
spec:
  selector:
    app: curity
  ports:
    - name: oauth
      port: 8443
      targetPort: 8443
    - name: admin
      port: 6749
      targetPort: 6749
