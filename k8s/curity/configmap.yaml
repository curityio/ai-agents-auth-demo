              </claims>
              <expose-metadata>
              </expose-metadata>
              <openid-connect>
                <expose-metadata>
                </expose-metadata>
              </openid-connect>
              <client-store>
                <config-backed>
                    <!-- agent-copilot and agent-specialist are no longer static clients.
                       They authenticate as CIMD ephemeral clients (private_key_jwt);
                       see the <ephemeral-client> block below. -->
                  <client>
                    <id>mcp-observability</id>
                    <!-- Demo-only static client. Secret is "Password1" (SHA-256 crypt);
                         seeded plaintext into the mcp-observability-curity Secret by
                         `make seed-mcp-observability-secret`. -->

                    <secret>$5$ph0y3bS2tgZdA4sn$WEUoFsW//uJuScGxgmyE4BLtwDxQuYAlz7M3kUEPhV0</secret>
                    <audience>obs-api</audience>
                    <scope>obs:read</scope>
                    <capabilities>
                      <oauth-token-exchange/>
                    </capabilities>
                  </client>
                  <client>
                    <id>mcp-ops</id>
                    <!-- Demo-only static client. Secret is "Password1" (SHA-256 crypt);
                         seeded plaintext into the mcp-ops-curity Secret by
                         `make seed-mcp-ops-secret`. -->
                    <secret>$5$25M.EdMDYXZU4RDM$UONAq/nCdEvl0LPjd.fGC.pdFByYZ1SWg0RQUgKJiwA</secret>
                    <audience>ops-api</audience>
                    <scope>ops:write</scope>
                    <capabilities>
                      <oauth-token-exchange/>
                    </capabilities>
                  </client>
                  <client>
                    <id>mcp-gateway</id>
                    <!-- Demo-only static client. Secret is "Password1" (SHA-256 crypt);
                         seeded plaintext into the mcp-gateway-curity Secret by
                         `make seed-mcp-gateway-secret`. The gateway fans out to the
                         two MCP backends, exchanging the broad aud=mcp-gateway caller
                         token down to a per-target audience+scope. -->
                    <secret>$5$25M.EdMDYXZU4RDM$UONAq/nCdEvl0LPjd.fGC.pdFByYZ1SWg0RQUgKJiwA</secret>
                    <audience>mcp-observability</audience>
                    <audience>mcp-ops</audience>
                    <scope>obs:read</scope>
                    <scope>ops:write</scope>
                    <capabilities>
                      <oauth-token-exchange/>
                    </capabilities>
                  </client>
                  <client>
                    <id>web-app</id>
                    <secret>$5$lqJUgjCGtVUGezi9$h7tKj75HEiTAIOuQzk.DelWt9Euc7hRE1qsWml86mk9</secret>
                    <redirect-uris>https://app.localtest.me/api/auth/callback/curity</redirect-uris>
                    <user-consent>
                    </user-consent>
                    <access-token-ttl>600</access-token-ttl>
                    <!-- web-app is REQUIRED: it feeds the id_token aud, which
                         OIDC/Auth.js require to include the client_id. Do NOT
                         remove it. The access token is narrowed to just
                         agent-copilot procedurally in authorization-code.js
                         (accessTokenData.aud), so this list only shapes the
                         id_token. -->
                    <audience>web-app</audience>
                    <audience>agent-copilot</audience>
                    <scope>openid</scope>
                    <scope>obs:read</scope>
                    <scope>ops:write</scope>
                    <scope>llm:invoke</scope>
                    <user-authentication>
                      <allowed-authenticators>html-auth</allowed-authenticators>
                      <allowed-authenticators>totp-authn</allowed-authenticators>
                      <force-authn>true</force-authn>
                    </user-authentication>
                    <allowed-origins>*</allowed-origins>
                    <capabilities>
                      <code>
                      </code>
                    </capabilities>
                    <validate-port-on-loopback-interfaces>true</validate-port-on-loopback-interfaces>
                  </client>
                </config-backed>
              </client-store>
              <ephemeral-client>
                <capabilities>
                  <oauth-token-exchange/>
                </capabilities>
                <client-authentication-method>
                  <asymmetrically-signed-jwt>
                    <signature-algorithms>
                      <all/>
                    </signature-algorithms>
                  </asymmetrically-signed-jwt>
                </client-authentication-method>
                <jwks-uri-same-origin>false</jwks-uri-same-origin>
                <scopes>
                  <scope>obs:read</scope>
                  <scope>ops:write</scope>
                </scopes>
                <!-- Mandatory: restrict the dereferenceable client_id hosts. The two
                     agents publish their CIMD documents under *.localtest.me. -->
                <client-id-restrictions>
                  <allow-list>
                    <domain>*.localtest.me</domain>
                  </allow-list>
                </client-id-restrictions>
                <!-- Fetch CIMD documents + JWKS with a client that trusts the mkcert
                     root CA (see facilities/crypto/ssl/server-truststore). -->
                <http-client>cimd-fetch</http-client>
              </ephemeral-client>
            </authorization-server>
          </settings>
          <endpoints>
            <endpoint>
              <id>token-service-anonymous</id>
