# Curity configuration ConfigMap.
#
# The XML below is intentionally a SKELETON — production-quality Curity XML
# config has a lot of details (HTTPS server config, plugin instances, key
# material). Treat this as a placeholder you will replace with output from
# your local Curity admin UI exported via `request-info`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: curity-config
  namespace: curity
data:
  curity-config.xml: |
    <config xmlns="http://tail-f.com/ns/config/1.0">
      <environments xmlns="https://curity.se/ns/conf/base">
        <environment>
          <base-url>https://curity.localtest.me</base-url>
          <admin-service>
            <http>
              <ssl-server-keystore>default-admin-ssl-key</ssl-server-keystore>
              <web-ui>
              </web-ui>
              <restconf>
              </restconf>
            </http>
          </admin-service>
          <!-- UI theme (System → Look and Feel). Curity 11's theme is config-native:
               the two Base64 leaves are embedded from k8s/curity/theme/{theme,custom}.css
               by `make curity-theme` (run by `make apply`) — edit the CSS, never the
               Base64. The template variables switch on the built-in dark body variant
               (white logo + white text on every template) and the single-colour
               authenticator chooser. -->
          <themes>
            <default-theme>
              <theme-css-properties></theme-css-properties>
              <theme-custom-css></theme-custom-css>
              <template-variables>
                <name>_configured_body_background</name>
                <value>body-dark</value>
              </template-variables>
              <template-variables>
                <name>_configured_single_color_authenticator_chooser</name>
                <value>true</value>
              </template-variables>
            </default-theme>
          </themes>
          <services>
            <zones>
              <default-zone>
                <symmetric-key>data:text/plain;aes,v:S.OVE5eHhERVQ5VGdTN3VxWg==.Tm59UxHsBjRjKkeKgJ55Mg==.7ERXyU_sG1nyFntlMMkXIQhwrq4D7MKlRGCUwS8wxj7V-8g3ejZMz0H2QoUAzxg-Ar7OSoVKWDCl1DKUSny9TfN3fjTsaf8tnL1YWCEX3aQ=.s-LQwnPYYO6-uH5ctpGcPsZWz7NyhpAuvNlQDWKf7jM=</symmetric-key>
              </default-zone>
            </zones>
            <service-role>
              <id>default</id>
              <!-- Plain HTTP runtime: the edge gateway terminates external TLS and
                   proxies plaintext to Curity (same pattern as web/grafana/agents).
                   base-url stays https, so iss/metadata/redirects remain https. This
                   also lets istiod fetch the JWKS over cluster DNS for the waypoint. -->
              <protocol>http</protocol>
              <webfinger/>
              <endpoints>applications</endpoints>
              <endpoints>authentication-service-anonymous</endpoints>
              <endpoints>authentication-service-authentication</endpoints>
              <endpoints>authentication-service-registration</endpoints>
              <endpoints>token-service-anonymous</endpoints>
              <endpoints>token-service-authorize</endpoints>
              <endpoints>token-service-introspect</endpoints>
              <endpoints>token-service-revoke</endpoints>
              <endpoints>token-service-session</endpoints>
              <endpoints>token-service-token</endpoints>
              <endpoints>token-service-userinfo</endpoints>
            </service-role>
          </services>
        </environment>
      </environments>
      <profiles xmlns="https://curity.se/ns/conf/base">
        <profile>
          <id>Applications</id>
          <type xmlns:apps="https://curity.se/ns/conf/profile/apps">apps:apps-service</type>
          <settings>
            <apps-service xmlns="https://curity.se/ns/conf/profile/apps">
              <oauth-profile-id>token-service</oauth-profile-id>
            </apps-service>
          </settings>
          <endpoints>
            <endpoint>
              <id>applications</id>
              <uri>/apps</uri>
              <endpoint-kind>apps-anonymous</endpoint-kind>
            </endpoint>
          </endpoints>
        </profile>
        <profile>
          <id>authentication-service</id>
          <type xmlns:auth="https://curity.se/ns/conf/profile/authentication">auth:authentication-service</type>
          <settings>
            <authentication-service xmlns="https://curity.se/ns/conf/profile/authentication">
              <authentication-actions>
                <authentication-action>
                  <id>add-roles</id>
                  <script-transformer xmlns="https://curity.se/ns/ext-conf/script-transformer">
                    <transformation-procedure>add-roles</transformation-procedure>
                  </script-transformer>
                </authentication-action>
                <authentication-action>
                  <id>mfa-totp</id>
                  <multi-factor-condition xmlns="https://curity.se/ns/ext-conf/multi-factor-condition">
                    <attribute-enable-condition>
                      <second-factor>
                        <id>totp-authn</id>
                      </second-factor>
                    </attribute-enable-condition>
                  </multi-factor-condition>
                </authentication-action>
              </authentication-actions>
              <authenticators>
                <authenticator>
                  <id>html-auth</id>
                  <authentication-context-class-reference>html-form</authentication-context-class-reference>
                  <authentication-actions>
                    <login>add-roles</login>
                    <login>mfa-totp</login>
                  </authentication-actions>
                  <html-form xmlns="https://curity.se/ns/conf/authenticators/html-form">
                    <account-manager>default-account-manager</account-manager>
                    <credential-manager>default-credential-manager</credential-manager>
                    <max-allowed-attempts>0</max-allowed-attempts>
                  </html-form>
                </authenticator>
                <authenticator>
                  <id>totp-authn</id>
                  <authentication-context-class-reference>mfa</authentication-context-class-reference>
                  <authentication-actions>
                    <login>add-roles</login>
                  </authentication-actions>
                  <required-authenticator-for-registration>html-auth</required-authenticator-for-registration>
                  <totp xmlns="https://curity.se/ns/ext-conf/totp">
                    <account-manager>
                      <id>default-account-manager</id>
                    </account-manager>
                    <bucket>
                      <data-source>default-datasource</data-source>
                    </bucket>
                    <auto-login-enabled>true</auto-login-enabled>
                    <allow-multiple-device-registration>true</allow-multiple-device-registration>
                    <auto-redirect-enabled>true</auto-redirect-enabled>
                    <generated-key-config>
                      <bucket>
                        <data-source>default-datasource</data-source>
                      </bucket>
                      <allow-user-to-set-device-alias>true</allow-user-to-set-device-alias>
                    </generated-key-config>
                  </totp>
                </authenticator>
              </authenticators>
              <protocols>
                <protocol>
                  <id>default-simple-protocol</id>
                  <simple-api/>
                </protocol>
              </protocols>
            </authentication-service>
          </settings>
          <endpoints>
            <endpoint>
              <id>authentication-service-anonymous</id>
              <uri>/authn/anonymous</uri>
              <endpoint-kind>auth-anonymous</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>authentication-service-authentication</id>
              <uri>/authn/authentication</uri>
              <endpoint-kind>auth-authentication</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>authentication-service-registration</id>
              <uri>/authn/registration</uri>
              <endpoint-kind>auth-registration</endpoint-kind>
            </endpoint>
          </endpoints>
        </profile>
        <profile>
          <id>token-service</id>
          <type xmlns:as="https://curity.se/ns/conf/profile/oauth">as:oauth-service</type>
          <expose-detailed-error-messages/>
          <settings>
            <authorization-server xmlns="https://curity.se/ns/conf/profile/oauth">
              <client-authentication>
                <asymmetrically-signed-jwt>
                  <signature-algorithm>RS256</signature-algorithm>
                  <signature-algorithm>RS512</signature-algorithm>
                  <signature-algorithm>ES256</signature-algorithm>
                </asymmetrically-signed-jwt>
              </client-authentication>
              <authentication-service>
                <authentication-profile>authentication-service</authentication-profile>
              </authentication-service>
              <client-capabilities>
                <code>
                </code>
                <implicit/>
                <client-credentials/>
                <introspection/>
                <oauth-token-exchange/>
              </client-capabilities>
              <scopes>
                <scope>
                  <id>address</id>
                  <description>OpenId Connect address scope</description>
                  <claims>address</claims>
                </scope>
                <scope>
                  <id>change:create</id>
                </scope>
                <scope>
                  <id>email</id>
                  <description>OpenId Connect email scope</description>
                  <claims>email</claims>
                  <claims>email_verified</claims>
                </scope>
                <scope>
                  <id>llm:invoke</id>
                  <description>Invoke the LLM gateway on behalf of the user</description>
                </scope>
                <scope>
                  <id>obs:read</id>
                  <description>Allow the AI copilot to read pod status, logs, and metrics on your behalf.</description>
                </scope>
                <scope>
                  <id>openid</id>
                  <description>Standard OpenID Connect scope</description>
                  <claims>roles</claims>
                </scope>
                <scope>
                  <id>ops:write</id>
                  <description>Allow the AI copilot to restart and scale deployments on your behalf. This is a privileged action requiring MFA</description>
                  <!-- Curity will not mint ops:write unless the delegation's authentication
                       context class is `mfa`. Before this binding the property was upheld
                       only by the web app declining to REQUEST ops:write at login
                       (apps/web/src/auth.ts) plus the acr checks at mcp-ops/ops-api; a
                       hand-crafted authorize request could still obtain the privileged
                       scope at acr=html-form. -->
                  <token-issuance-authorizer>require-mfa-for-privileged</token-issuance-authorizer>
                </scope>
                <scope>
                  <id>phone</id>
                  <description>OpenId Connect phone scope</description>
                  <claims>phone_number</claims>
                  <claims>phone_number_verified</claims>
                </scope>
                <scope>
                  <id>profile</id>
                  <description>OpenId Connect profile scope</description>
                  <claims>birthdate</claims>
                  <claims>family_name</claims>
                  <claims>gender</claims>
                  <claims>given_name</claims>
                  <claims>locale</claims>
                  <claims>middle_name</claims>
                  <claims>name</claims>
                  <claims>nickname</claims>
                  <claims>picture</claims>
                  <claims>preferred_username</claims>
                  <claims>profile</claims>
                  <claims>updated_at</claims>
                  <claims>website</claims>
                  <claims>zoneinfo</claims>
                </scope>
              </scopes>
              <claims>
                <claim>
                  <name>address</name>
                  <description>OpenID Connect address claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>birthdate</name>
                  <description>OpenID Connect birthdate claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>email</name>
                  <description>OpenID Connect email claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>email_verified</name>
                  <description>OpenID Connect email_verified claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>family_name</name>
                  <description>OpenID Connect family_name claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>gender</name>
                  <description>OpenID Connect gender claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>given_name</name>
                  <description>OpenID Connect given_name claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>locale</name>
                  <description>OpenID Connect locale claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>middle_name</name>
                  <description>OpenID Connect middle_name claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>name</name>
                  <description>OpenID Connect name claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>nickname</name>
                  <description>OpenID Connect nickname claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>phone_number</name>
                  <description>OpenID Connect phone_number claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>phone_number_verified</name>
                  <description>OpenID Connect phone_number_verified claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>picture</name>
                  <description>OpenID Connect picture claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>preferred_username</name>
                  <description>OpenID Connect preferred_username claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>profile</name>
                  <description>OpenID Connect profile claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>roles</name>
                  <description>Allow to share your roles (e.g. SRE) so the system can verify you are authorized for privileged operations.</description>
                  <value-provided-by>authn-sub-claims-value-provider</value-provided-by>
                  <transformation>
                    <input-attribute-names>roles</input-attribute-names>
                  </transformation>
                </claim>
                <claim>
                  <name>updated_at</name>
                  <description>OpenID Connect updated_at claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>website</name>
                  <description>OpenID Connect website claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>zoneinfo</name>
                  <description>OpenID Connect zoneinfo claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claims-value-provider>
                  <id>account-manager-claims-provider</id>
                  <account-manager-claims-provider xmlns="https://curity.se/ns/ext-conf/account-manager-claims-provider">
                    <account-manager>
                      <id>default-account-manager</id>
                    </account-manager>
                  </account-manager-claims-provider>
                </claims-value-provider>
                <claims-value-provider>
                  <id>authn-sub-claims-value-provider</id>
                  <authentication-subject-claims-provider xmlns="https://curity.se/ns/ext-conf/authentication-subject-claims-provider"/>
                </claims-value-provider>
                <claims-mappers>
                  <claims-mapper>
                    <id>default</id>
                    <access_token>
                      <claim>roles</claim>
                    </access_token>
                    <id_token>
                      <claim>address</claim>
                      <claim>birthdate</claim>
                      <claim>email</claim>
                      <claim>email_verified</claim>
                      <claim>family_name</claim>
                      <claim>gender</claim>
                      <claim>given_name</claim>
                      <claim>locale</claim>
                      <claim>middle_name</claim>
                      <claim>name</claim>
                      <claim>nickname</claim>
                      <claim>phone_number</claim>
                      <claim>phone_number_verified</claim>
                      <claim>picture</claim>
                      <claim>preferred_username</claim>
                      <claim>profile</claim>
                      <claim>roles</claim>
                      <claim>updated_at</claim>
                      <claim>website</claim>
                      <claim>zoneinfo</claim>
                    </id_token>
                    <userinfo>
                      <claim>address</claim>
                      <claim>birthdate</claim>
                      <claim>email</claim>
                      <claim>email_verified</claim>
                      <claim>family_name</claim>
                      <claim>gender</claim>
                      <claim>given_name</claim>
                      <claim>locale</claim>
                      <claim>middle_name</claim>
                      <claim>name</claim>
                      <claim>nickname</claim>
                      <claim>phone_number</claim>
                      <claim>phone_number_verified</claim>
                      <claim>picture</claim>
                      <claim>preferred_username</claim>
                      <claim>profile</claim>
                      <claim>updated_at</claim>
                      <claim>website</claim>
                      <claim>zoneinfo</claim>
                    </userinfo>
                  </claims-mapper>
                  <default-claims-mapper>default</default-claims-mapper>
                </claims-mappers>
              </claims>
              <expose-metadata>
              </expose-metadata>
              <openid-connect>
                <expose-metadata>
                </expose-metadata>
              </openid-connect>
              <!-- Token Issuance Authorizers (TIA). A TIA decides, per requested scope,
                   whether Curity may RELEASE that scope: allow / deny / require-consent /
                   cap-its-TTL. It runs on every grant that requests the scope, including
                   each RFC 8693 exchange hop (GrantType.OAUTH_TOKEN_EXCHANGE), so the
                   decision is an issuance invariant rather than a convention upheld by
                   whichever client happens to be asking. -->
              <token-issuance-authorizers>
                <token-issuance-authorizer>
                  <id>require-mfa-for-privileged</id>
                  <description>Deny privileged scopes unless the user authenticated with MFA (acr=mfa)</description>
                  <acr-token-issuance-authorizer xmlns="https://curity.se/ns/ext-conf/acr-token-issuance-authorizer">
                    <required-acr>mfa</required-acr>
                  </acr-token-issuance-authorizer>
                </token-issuance-authorizer>
              </token-issuance-authorizers>
              <client-store>
                <config-backed>
                    <!-- agent-copilot and agent-specialist are no longer static clients.
                       They authenticate as CIMD ephemeral clients (private_key_jwt);
                       see the <ephemeral-client> block below. -->
                  <client>
                    <id>mcp-observability</id>
                    <!-- Demo-only static client. Secret is "Password1" (SHA-256 crypt);
                         seeded plaintext into the mcp-observability-curity Secret by
                         `make seed-mcp-observability-secret`. -->

                    <secret>$5$ph0y3bS2tgZdA4sn$WEUoFsW//uJuScGxgmyE4BLtwDxQuYAlz7M3kUEPhV0</secret>
                    <access-token-ttl>600</access-token-ttl>
                    <audience>obs-api</audience>
                    <scope>obs:read</scope>
                    <capabilities>
                      <oauth-token-exchange/>
                    </capabilities>
                  </client>
                  <client>
                    <id>mcp-ops</id>
                    <!-- Demo-only static client. Secret is "Password1" (SHA-256 crypt);
                         seeded plaintext into the mcp-ops-curity Secret by
                         `make seed-mcp-ops-secret`. -->
                    <secret>$5$25M.EdMDYXZU4RDM$UONAq/nCdEvl0LPjd.fGC.pdFByYZ1SWg0RQUgKJiwA</secret>
                    <access-token-ttl>600</access-token-ttl>
                    <audience>ops-api</audience>
                    <scope>ops:write</scope>
                    <capabilities>
                      <oauth-token-exchange/>
                    </capabilities>
                  </client>
                  <client>
                    <id>mcp-gateway</id>
                    <!-- Demo-only static client. Secret is "Password1" (SHA-256 crypt);
                         seeded plaintext into the mcp-gateway-curity Secret by
                         `make seed-mcp-gateway-secret`. The gateway fans out to the
                         two MCP backends, exchanging the broad aud=mcp-gateway caller
                         token down to a per-target audience+scope. -->
                    <secret>$5$25M.EdMDYXZU4RDM$UONAq/nCdEvl0LPjd.fGC.pdFByYZ1SWg0RQUgKJiwA</secret>
                    <access-token-ttl>600</access-token-ttl>
                    <audience>mcp-observability</audience>
                    <audience>mcp-ops</audience>
                    <scope>obs:read</scope>
                    <scope>ops:write</scope>
                    <capabilities>
                      <oauth-token-exchange/>
                    </capabilities>
                  </client>
                  <client>
                    <id>web-app</id>
                    <secret>$5$lqJUgjCGtVUGezi9$h7tKj75HEiTAIOuQzk.DelWt9Euc7hRE1qsWml86mk9</secret>
                    <redirect-uris>https://app.localtest.me/api/auth/callback/curity</redirect-uris>
                    <user-consent>
                    </user-consent>
                    <access-token-ttl>600</access-token-ttl>
                    <!-- web-app is REQUIRED: it feeds the id_token aud, which
                         OIDC/Auth.js require to include the client_id. Do NOT
                         remove it. The access token is narrowed to just
                         agent-copilot procedurally in authorization-code.js
                         (accessTokenData.aud), so this list only shapes the
                         id_token. -->
                    <audience>web-app</audience>
                    <audience>agent-copilot</audience>
                    <scope>openid</scope>
                    <scope>obs:read</scope>
                    <scope>ops:write</scope>
                    <scope>llm:invoke</scope>
                    <user-authentication>
                      <allowed-authenticators>html-auth</allowed-authenticators>
                      <allowed-authenticators>totp-authn</allowed-authenticators>
                      <force-authn>true</force-authn>
                    </user-authentication>
                    <allowed-origins>*</allowed-origins>
                    <capabilities>
                      <code>
                      </code>
                    </capabilities>
                    <validate-port-on-loopback-interfaces>true</validate-port-on-loopback-interfaces>
                  </client>
                </config-backed>
              </client-store>
              <ephemeral-client>
                <capabilities>
                  <oauth-token-exchange/>
                </capabilities>
                <client-authentication-method>
                  <asymmetrically-signed-jwt>
                    <signature-algorithms>
                      <all/>
                    </signature-algorithms>
                  </asymmetrically-signed-jwt>
                </client-authentication-method>
                <jwks-uri-same-origin>false</jwks-uri-same-origin>
                <!-- Every token Curity mints lives 10 minutes: the web-app login token
                     (its own client block), the three static exchange clients above,
                     and the two CIMD agents here. The schema default is 300 s, so
                     omitting this on any client silently shortens that client's
                     exchanged tokens. token-exchange.js reports expires_in from the
                     issued token's exp rather than a constant, so it follows this. -->
                <access-token-ttl>600</access-token-ttl>
                <scopes>
                  <scope>obs:read</scope>
                  <scope>ops:write</scope>
                  <scope>llm:invoke</scope>
                </scopes>
                <!-- Mandatory: restrict the dereferenceable client_id hosts. The two
                     agents publish their CIMD documents under *.localtest.me. -->
                <client-id-restrictions>
                  <allow-list>
                    <domain>*.localtest.me</domain>
                  </allow-list>
                </client-id-restrictions>
                <!-- Fetch CIMD documents + JWKS with a client that trusts the mkcert
                     root CA (see facilities/crypto/ssl/server-truststore). -->
                <http-client>cimd-fetch</http-client>
              </ephemeral-client>
            </authorization-server>
          </settings>
          <endpoints>
            <endpoint>
              <id>token-service-anonymous</id>
              <uri>/oauth/v2/oauth-anonymous</uri>
              <endpoint-kind>oauth-anonymous</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-authorize</id>
              <uri>/oauth/v2/oauth-authorize</uri>
              <endpoint-kind>oauth-authorize</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-introspect</id>
              <uri>/oauth/v2/oauth-introspect</uri>
              <endpoint-kind>oauth-introspect</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-revoke</id>
              <uri>/oauth/v2/oauth-revoke</uri>
              <endpoint-kind>oauth-revoke</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-session</id>
              <uri>/oauth/v2/oauth-session</uri>
              <endpoint-kind>oauth-session</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-token</id>
              <uri>/oauth/v2/oauth-token</uri>
              <endpoint-kind>oauth-token</endpoint-kind>
              <token-endpoint-procedures>
                <flow>oauth-token-authorization-code</flow>
                <procedure>acr-passthrough</procedure>
              </token-endpoint-procedures>
              <token-endpoint-procedures>
                <flow>oauth-token-oauth-token-exchange</flow>
                <procedure>spiffe-actor-validation</procedure>
              </token-endpoint-procedures>
            </endpoint>
            <endpoint>
              <id>token-service-userinfo</id>
              <uri>/oauth/v2/oauth-userinfo</uri>
              <endpoint-kind>oauth-userinfo</endpoint-kind>
            </endpoint>
          </endpoints>
          <token-issuers>
            <default-token-issuer>
