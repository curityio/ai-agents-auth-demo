# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway config — path-routed MCP front door for mcp-observability +
# mcp-ops, plus the governed /llm egress. Validated against agentgateway v1.3.1.
#
# Why path-routed instead of one federated /mcp endpoint: the `mcp` CEL context
# (`mcp.tool.target` / `mcp.tool.name`) is NOT available inside `extAuthz` — it
# runs at the HTTP layer before MCP tool multiplexing, and any `mcp.*` reference
# in extAuthz `addRequestHeaders` evaluates to undefined and silently drops the
# ENTIRE computed header map. Per-backend audience narrowing therefore needs one
# route per backend, each with a STATIC x-target-audience; callers pick the path.
# (`mcpAuthorization`, by contrast, runs at the MCP layer where `mcp.tool.name`
# IS available.)
#
# YAML foot-gun: an unquoted CEL ternary `A ? B : C` parses as a YAML complex
# mapping key and fails as "expected a string" — keep all CEL single-quoted.
#
# Deployment: mounted into the agentgateway pod, run with `agentgateway --file`.
# The exchange-shim runs co-located (same pod, localhost:8090) — see
# apps/exchange-shim. JWKS uses the plain-HTTP in-cluster Service URL because
# pods cannot resolve curity.localtest.me (CLAUDE.md facts #5/#21).

# DNS resolver tuning for external egress (the /llm azure backend).
# agentgateway's Rust (hickory) resolver otherwise fails to resolve the public
# Azure host with "DNS resolution which failed" (NoHealthyBackend/503), while
# glibc/Node in the same cluster resolves it fine. Two observed causes:
#   - The Azure host has NO AAAA record (ENODATA); the default lookup family
#     queries IPv6 too. This cluster is all-IPv4 → force V4Only.
#   - The A answer is a CNAME chain + several records that overflows the 512-byte
#     UDP limit; without EDNS0 the response is truncated and the resolver fails
#     to recover. edns0 advertises a larger UDP buffer so CoreDNS returns it whole.
config:
  dns:
    lookupFamily: V4Only
    edns0: true

binds:
- port: 8080
  listeners:
  - name: mcp
    protocol: HTTP
    routes:

    # ------------------------------------------------------------------ #
    # Observability backend  ->  GET/POST {gateway}:8080/observability/mcp
    # Read-only tools: list_pods, get_pod_logs, get_deployment.
    # Audience narrowed to mcp-observability; the shim maps that audience to
    # the obs:read scope from its own allow-list (never a caller-supplied scope).
    # ------------------------------------------------------------------ #
    - name: observability
      matches:
      - path:
          pathPrefix: /observability/mcp
      policies:
        mcpAuthentication:
          issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
          audiences:
          - mcp-gateway
          jwks:
            url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
          resourceMetadata:
            resource: https://mcp-gateway.localtest.me/observability/mcp
            scopesSupported:
            - obs:read
            bearerMethodsSupported:
            - header
        # Read tier: obs:read required for every observability tool (mirrors the
        # ops tier's ops:write invariant). Reads are unprivileged — no role gate.
        mcpAuthorization:
          rules:
          - '"obs:read" in (jwt.scope.split(" ")) && mcp.tool.name in ["list_pods", "get_pod_logs", "get_deployment"]'
        # Namespace confinement (SEP-2243), same construction as the ops route: the
        # read tools declare `x-mcp-header: Namespace`, so the client mirrors that
        # argument into `Mcp-Param-Namespace` and a cross-namespace read (e.g. pod
        # logs from kube-system) is refused here rather than relying solely on
        # obs-api's RBAC. "Present AND not prod" so omitting the argument — the
        # common case, since the server defaults it — never trips the rule.
        authorization:
          rules:
          - deny: 'request.headers["mcp-param-namespace"] != "" && request.headers["mcp-param-namespace"] != "prod"'
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                # Original caller bearer. Must come from jwt.rawToken.unredacted():
                # the JWT auth layer strips request.headers["authorization"] before
                # extAuthz runs (VERIFIED). The shim strips the "Bearer " prefix.
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                # Static per-route audience (see header: mcp.* is unavailable here).
                # The shim derives the scope from this audience; NO x-target-scope.
                x-target-audience: '"mcp-observability"'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
      backends:
      - mcp:
          targets:
          - name: observability
            mcp:
              host: mcp-observability.mcp.svc.cluster.local
              port: 8080
              path: /mcp

    # ------------------------------------------------------------------ #
    # Ops backend  ->  GET/POST {gateway}:8080/ops/mcp
    # Write tools: restart_deployment, scale_deployment (safe writes) and the
    # SHOWCASE tool set_deployment_image (privileged). Audience narrowed to
    # mcp-ops -> shim maps to ops:write scope.
    # ------------------------------------------------------------------ #
    - name: ops
      matches:
      - path:
          pathPrefix: /ops/mcp
      policies:
        mcpAuthentication:
          issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
          audiences:
          - mcp-gateway
          jwks:
            url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
          resourceMetadata:
            resource: https://mcp-gateway.localtest.me/ops/mcp
            scopesSupported:
            - ops:write
            bearerMethodsSupported:
            - header
        # Tier gate: ops:write is required for every ops tool. The Curity exchange
        # already requires a WRITE role (sre OR oncall) to issue ops:write, so every
        # caller reaching this route holds one.
        #
        # NOTE this is `mcpAuthorization` (the MCP layer), where a denial ALSO hides
        # the tool from tools/list — agentgateway couples visibility to call-authz.
        # That is why the per-tool role split is NOT expressed here: hiding
        # set_deployment_image from an oncall caller would make its LLM never attempt
        # the tool (a silent no-op instead of a legible denial). The split lives in
        # the `authorization` policy below, which is the HTTP layer and does not
        # participate in tools/list filtering.
        mcpAuthorization:
          rules:
          - '"ops:write" in (jwt.scope.split(" ")) && mcp.tool.name in ["restart_deployment", "scale_deployment", "set_deployment_image"]'
        # Per-tool role split: set_deployment_image requires the `sre` role.
        #
        # Why HERE and not in mcpAuthorization above: `authorization` is an
        # HTTP-layer policy (crates/agentgateway/src/http/authorization.rs, applied
        # via Executor::new_request). It never runs in the MCP tools/list path, so a
        # denial refuses the CALL while leaving the tool VISIBLE — exactly what the
        # MCP-layer policy cannot do.
        #
        # ORDERING (measured, 2026-08-05, v1.4.1): for ROUTE-level policies extAuthz
        # runs BEFORE authorization, so a denied tool-call still performs the OBO
        # exchange — a privileged aud=mcp-ops token IS minted and then discarded
        # unused. Do not read httpproxy.rs and conclude otherwise: it has three
        # policy application sites with DIFFERENT orders (the backend-level site does
        # run authorization first). Verified by counting exchange-shim EXCHANGE lines:
        # connect-only = 1, connect + denied call = 2. Consequence: the deny stops the
        # request reaching mcp-ops, but it is not a way to avoid minting the token.
        #
        # Keyed on `Mcp-Name`, the 2026-07-28 tools/call header. This is only sound
        # because the MCP servers run `legacy: 'reject'` and the agents pin the
        # revision — on a 2025 hop the header would not exist and this rule would
        # silently never fire. See CLAUDE.md fact #26.
        #
        # Deny-only ⇒ denylist semantics: with no `allow` rules present, every other
        # request is unaffected (agentgateway defaults to allow unless an allow rule
        # exists but does not match). tools/list and server/discover carry no
        # Mcp-Name, so they never match this rule.
        #
        # mcp-ops REMAINS AUTHORITATIVE — this is a first line, not the only one. If
        # the `roles` claim were ever absent the expression cannot evaluate true and
        # the deny fails open, so the downstream check in mcp-ops
        # (`Config.setImageRequiredRoles`, apps/mcp-ops/src/mcp.ts `imageRoleDenial`)
        # is what makes the split unconditional. Those two MUST agree: change the role
        # here and in SET_IMAGE_REQUIRED_ROLES together.
        #
        # The second rule is namespace confinement (SEP-2243). The ops tools declare
        # `x-mcp-header: Namespace` on their `namespace` input, so a conforming client
        # mirrors that argument into `Mcp-Param-Namespace` — which lets the gateway
        # reject a cross-namespace write at the front door instead of relying solely
        # on ops-api's RBAC. Written as "present AND not prod" so that OMITTING the
        # argument (the common case — the server defaults it) never trips the rule,
        # whichever way a missing header evaluates. Keep 'prod' in step with
        # TARGET_NAMESPACE on mcp-ops/ops-api.
        authorization:
          rules:
          - deny: 'request.headers["mcp-name"] == "set_deployment_image" && !("sre" in jwt.roles)'
          - deny: 'request.headers["mcp-param-namespace"] != "" && request.headers["mcp-param-namespace"] != "prod"'
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                x-target-audience: '"mcp-ops"'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
      backends:
      - mcp:
          targets:
          - name: ops
            mcp:
              host: mcp-ops.mcp.svc.cluster.local
              port: 8080
              path: /mcp

    # ------------------------------------------------------------------ #
    # LLM egress -> {gateway}:8080/llm  (OpenAI-compatible; azure backend)
    # Identity-bound reasoning hop. jwtAuth(aud=llm-gateway) + require llm:invoke;
    # the gateway holds the ONLY Azure key (backendAuth.key). No shim, no act-chain:
    # Azure is outside the Curity trust domain — a single upstream credential swap.
    # ------------------------------------------------------------------ #
    - name: llm
      matches:
      - path:
          pathPrefix: /llm
      policies:
        jwtAuth:
          providers:
          - issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
            audiences:
            - llm-gateway
            jwks:
              url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
        authorization:
          rules:
          - require: '"llm:invoke" in (jwt.scope.split(" "))'
        backendAuth:
          key:
            value: $AZURE_OPENAI_API_KEY
            location:
              header:
                name: api-key
                prefix: ""
      backends:
      - ai:
          name: azure
          provider:
            azure:
              resourceName: $AZURE_RESOURCE_NAME
              resourceType: openAI
              model: gpt-4.1
              apiVersion: "2024-04-01-preview"

    # ------------------------------------------------------------------ #
    # DEMO-ONLY chain-visualization passthroughs (NOT part of the enforcement
    # path). The web UI walks the OBO chain by recursively calling each service's
    # /last-token. Since the agents now reach the MCP servers only THROUGH this
    # gateway, these plain-HTTP routes proxy
    #   {gateway}/observability/last-token → mcp-observability:8080/last-token
    #   {gateway}/ops/last-token           → mcp-ops:8080/last-token
    # through the SAME extAuthz→shim exchange as the /mcp routes, so the caller's
    # aud=mcp-gateway token is narrowed to aud=mcp-observability / aud=mcp-ops —
    # the audience each /last-token endpoint verifies. urlRewrite strips the
    # /observability|/ops prefix so the origin sees plain /last-token.
    # ------------------------------------------------------------------ #
    - name: observability-last-token
      matches:
      - path:
          pathPrefix: /observability/last-token
      policies:
        jwtAuth:
          providers:
          - issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
            audiences:
            - mcp-gateway
            jwks:
              url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                x-target-audience: '"mcp-observability"'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
        urlRewrite:
          path:
            full: /last-token
      backends:
      - host: mcp-observability.mcp.svc.cluster.local:8080

    - name: ops-last-token
      matches:
      - path:
          pathPrefix: /ops/last-token
      policies:
        jwtAuth:
          providers:
          - issuer: https://curity.localtest.me/oauth/v2/oauth-anonymous
            audiences:
            - mcp-gateway
            jwks:
              url: http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks
        extAuthz:
          host: localhost:8090
          failureMode: deny
          protocol:
            http:
              path: '"/exchange"'
              addRequestHeaders:
                x-caller-authorization: '"Bearer " + jwt.rawToken.unredacted()'
                x-target-audience: '"mcp-ops"'
              metadata:
                token: json(response.body).access_token
        transformations:
          request:
            set:
              authorization: '"Bearer " + extauthz.token'
        urlRewrite:
          path:
            full: /last-token
      backends:
      - host: mcp-ops.mcp.svc.cluster.local:8080

    # ------------------------------------------------------------------ #
    # Workload-identity readout for the web "Workload identities" panel.
    # Unlike the agents/MCP servers, agentgateway is a Rust binary with no
    # /spiffe-id of its own — but the co-located exchange-shim reads the SAME
    # rotating SVID the gateway presents as its actor_token, so the shim's
    # /spiffe-id IS agentgateway's workload identity. Plain read-only proxy:
    # NO jwtAuth / extAuthz / rewrite (identity claims aren't secret, same as
    # the other /spiffe-id endpoints). This route deliberately exposes ONLY
    # /spiffe-id from the shim — the token-exchange /exchange endpoint has no
    # route and therefore never reaches the Service.
    # ------------------------------------------------------------------ #
    - name: gateway-spiffe-id
      matches:
      - path:
          pathPrefix: /spiffe-id
      backends:
      - host: localhost:8090
