        <http>
        <!-- Used by the ephemeral-client (CIMD) feature to dereference each agent's
               client_id URL over HTTPS. Hostname verification stays ON (the gateway
               cert SANs match copilot/specialist.localtest.me); trust anchors come from
               the crypto server-truststore (the mkcert root CA, embedded below). -->
          <client>
            <id>cimd-fetch</id>
            <tls>
              <use-truststore>true</use-truststore>
            </tls>
          </client>
          <!-- Used by the token-exchange procedure (spiffe-actor-validation) to fetch
               SPIRE's JWKS from the OIDC discovery provider. Its serving cert chains to
               the demo's shared root CA (server-truststore entry `shared-root-ca`, embedded
               by `make curity-truststore`); hostname verification is off because the SAN
               is the external name (oidc-discovery.demo.curity.local), not the in-cluster
               Service FQDN the procedure dials. -->
          <client>
            <id>http-client-spiffe</id>
            <tls>
              <disable-hostname-verification>true</disable-hostname-verification>
              <use-truststore>true</use-truststore>
            </tls>
          </client>
        </http>
