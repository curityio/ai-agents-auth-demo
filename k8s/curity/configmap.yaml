# Curity configuration ConfigMap.
#
# The XML below is intentionally a SKELETON — production-quality Curity XML
# config has a lot of details (HTTPS server config, plugin instances, key
# material). Treat this as a placeholder you will replace with output from
# your local Curity admin UI exported via `request-info`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: curity-config
  namespace: curity
data:
  curity-config.xml: |
    <config xmlns="http://tail-f.com/ns/config/1.0">
      <environments xmlns="https://curity.se/ns/conf/base">
        <environment>
          <base-url>https://curity.localtest.me</base-url>
          <admin-service>
            <http>
              <ssl-server-keystore>default-admin-ssl-key</ssl-server-keystore>
              <web-ui>
              </web-ui>
              <restconf>
              </restconf>
            </http>
          </admin-service>
          <services>
            <zones>
              <default-zone>
                <symmetric-key>data:text/plain;aes,v:S.OVE5eHhERVQ5VGdTN3VxWg==.Tm59UxHsBjRjKkeKgJ55Mg==.7ERXyU_sG1nyFntlMMkXIQhwrq4D7MKlRGCUwS8wxj7V-8g3ejZMz0H2QoUAzxg-Ar7OSoVKWDCl1DKUSny9TfN3fjTsaf8tnL1YWCEX3aQ=.s-LQwnPYYO6-uH5ctpGcPsZWz7NyhpAuvNlQDWKf7jM=</symmetric-key>
              </default-zone>
            </zones>
            <service-role>
              <id>default</id>
              <!-- Plain HTTP runtime: the edge gateway terminates external TLS and
                   proxies plaintext to Curity (same pattern as web/grafana/agents).
                   base-url stays https, so iss/metadata/redirects remain https. This
                   also lets istiod fetch the JWKS over cluster DNS for the waypoint. -->
              <protocol>http</protocol>
              <webfinger/>
              <endpoints>applications</endpoints>
              <endpoints>authentication-service-anonymous</endpoints>
              <endpoints>authentication-service-authentication</endpoints>
              <endpoints>authentication-service-registration</endpoints>
              <endpoints>token-service-anonymous</endpoints>
              <endpoints>token-service-authorize</endpoints>
              <endpoints>token-service-introspect</endpoints>
              <endpoints>token-service-revoke</endpoints>
              <endpoints>token-service-session</endpoints>
              <endpoints>token-service-token</endpoints>
              <endpoints>token-service-userinfo</endpoints>
            </service-role>
          </services>
        </environment>
      </environments>
      <profiles xmlns="https://curity.se/ns/conf/base">
        <profile>
          <id>Applications</id>
          <type xmlns:apps="https://curity.se/ns/conf/profile/apps">apps:apps-service</type>
          <settings>
            <apps-service xmlns="https://curity.se/ns/conf/profile/apps">
              <oauth-profile-id>token-service</oauth-profile-id>
            </apps-service>
          </settings>
          <endpoints>
            <endpoint>
              <id>applications</id>
              <uri>/apps</uri>
              <endpoint-kind>apps-anonymous</endpoint-kind>
            </endpoint>
          </endpoints>
        </profile>
        <profile>
          <id>authentication-service</id>
          <type xmlns:auth="https://curity.se/ns/conf/profile/authentication">auth:authentication-service</type>
          <settings>
            <authentication-service xmlns="https://curity.se/ns/conf/profile/authentication">
              <authentication-actions>
                <authentication-action>
                  <id>add-roles</id>
                  <script-transformer xmlns="https://curity.se/ns/ext-conf/script-transformer">
                    <transformation-procedure>add-roles</transformation-procedure>
                  </script-transformer>
                </authentication-action>
                <authentication-action>
                  <id>mfa-totp</id>
                  <multi-factor-condition xmlns="https://curity.se/ns/ext-conf/multi-factor-condition">
                    <attribute-enable-condition>
                      <second-factor>
                        <id>totp-authn</id>
                      </second-factor>
                    </attribute-enable-condition>
                  </multi-factor-condition>
                </authentication-action>
                <authentication-action>
                  <id>debug-1</id>
                  <debug-attribute xmlns="https://curity.se/ns/ext-conf/debug-attribute"/>
                </authentication-action>
              </authentication-actions>
              <authenticators>
                <authenticator>
                  <id>html-auth</id>
                  <authentication-context-class-reference>html-form</authentication-context-class-reference>
                  <authentication-actions>
                    <login>add-roles</login>
                    <login>mfa-totp</login>
                    <login>debug-1</login>
                  </authentication-actions>
                  <html-form xmlns="https://curity.se/ns/conf/authenticators/html-form">
                    <account-manager>default-account-manager</account-manager>
                    <credential-manager>default-credential-manager</credential-manager>
                    <max-allowed-attempts>0</max-allowed-attempts>
                  </html-form>
                </authenticator>
                <authenticator>
                  <id>totp-authn</id>
                  <authentication-context-class-reference>mfa</authentication-context-class-reference>
                  <authentication-actions>
                    <login>add-roles</login>
                    <login>debug-1</login>
                  </authentication-actions>
                  <required-authenticator-for-registration>html-auth</required-authenticator-for-registration>
                  <totp xmlns="https://curity.se/ns/ext-conf/totp">
                    <account-manager>
                      <id>default-account-manager</id>
                    </account-manager>
                    <bucket>
                      <data-source>default-datasource</data-source>
                    </bucket>
                    <auto-login-enabled>true</auto-login-enabled>
                    <allow-multiple-device-registration>true</allow-multiple-device-registration>
                    <auto-redirect-enabled>true</auto-redirect-enabled>
                    <generated-key-config>
                      <bucket>
                        <data-source>default-datasource</data-source>
                      </bucket>
                      <allow-user-to-set-device-alias>true</allow-user-to-set-device-alias>
                    </generated-key-config>
                  </totp>
                </authenticator>
              </authenticators>
              <protocols>
                <protocol>
                  <id>default-simple-protocol</id>
                  <simple-api/>
                </protocol>
              </protocols>
            </authentication-service>
          </settings>
          <endpoints>
            <endpoint>
              <id>authentication-service-anonymous</id>
              <uri>/authn/anonymous</uri>
              <endpoint-kind>auth-anonymous</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>authentication-service-authentication</id>
              <uri>/authn/authentication</uri>
              <endpoint-kind>auth-authentication</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>authentication-service-registration</id>
              <uri>/authn/registration</uri>
              <endpoint-kind>auth-registration</endpoint-kind>
            </endpoint>
          </endpoints>
        </profile>
        <profile>
          <id>token-service</id>
          <type xmlns:as="https://curity.se/ns/conf/profile/oauth">as:oauth-service</type>
          <expose-detailed-error-messages/>
          <settings>
            <authorization-server xmlns="https://curity.se/ns/conf/profile/oauth">
              <client-authentication>
                <asymmetrically-signed-jwt>
                  <signature-algorithm>RS256</signature-algorithm>
                  <signature-algorithm>RS512</signature-algorithm>
                  <signature-algorithm>ES256</signature-algorithm>
                </asymmetrically-signed-jwt>
              </client-authentication>
              <authentication-service>
                <authentication-profile>authentication-service</authentication-profile>
              </authentication-service>
              <client-capabilities>
                <code>
                </code>
                <implicit/>
                <client-credentials/>
                <introspection/>
                <oauth-token-exchange/>
              </client-capabilities>
              <scopes>
                <scope>
                  <id>address</id>
                  <description>OpenId Connect address scope</description>
                  <claims>address</claims>
                </scope>
                <scope>
                  <id>change:create</id>
                </scope>
                <scope>
                  <id>email</id>
                  <description>OpenId Connect email scope</description>
                  <claims>email</claims>
                  <claims>email_verified</claims>
                </scope>
                <scope>
                  <id>llm:invoke</id>
                  <description>Invoke the LLM gateway on behalf of the user</description>
                </scope>
                <scope>
                  <id>obs:read</id>
                  <description>Allow the AI copilot to read pod status, logs, and metrics on your behalf.</description>
                </scope>
                <scope>
                  <id>openid</id>
                  <description>Standard OpenID Connect scope</description>
                  <claims>roles</claims>
                </scope>
                <scope>
                  <id>ops:write</id>
                  <description>Allow the AI copilot to restart and scale deployments on your behalf. This is a privileged action requiring MFA</description>
                </scope>
                <scope>
                  <id>phone</id>
                  <description>OpenId Connect phone scope</description>
                  <claims>phone_number</claims>
                  <claims>phone_number_verified</claims>
                </scope>
                <scope>
                  <id>profile</id>
                  <description>OpenId Connect profile scope</description>
                  <claims>birthdate</claims>
                  <claims>family_name</claims>
                  <claims>gender</claims>
                  <claims>given_name</claims>
                  <claims>locale</claims>
                  <claims>middle_name</claims>
                  <claims>name</claims>
                  <claims>nickname</claims>
                  <claims>picture</claims>
                  <claims>preferred_username</claims>
                  <claims>profile</claims>
                  <claims>updated_at</claims>
                  <claims>website</claims>
                  <claims>zoneinfo</claims>
                </scope>
              </scopes>
              <claims>
                <claim>
                  <name>address</name>
                  <description>OpenID Connect address claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>birthdate</name>
                  <description>OpenID Connect birthdate claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
                </claim>
                <claim>
                  <name>email</name>
                  <description>OpenID Connect email claim</description>
                  <value-provided-by>account-manager-claims-provider</value-provided-by>
