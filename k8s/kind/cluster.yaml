# KIND cluster for the AI agent demo.
# Single control-plane node with extraPortMappings so the Istio ingress
# gateway can serve 80/443 on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-agents-demo
nodes:
  - role: control-plane
    # PINNED, deliberately. With no `image:` the node — and therefore the
    # Kubernetes version — follows whichever `kind` binary happens to run this,
    # so two people (or the same machine after a `brew upgrade kind`) get
    # different clusters from an unchanged repo. The digest is included because
    # kindest/node tags are rebuilt in place.
    #
    # This is not hypothetical here: the boot-time OOM in CLAUDE.md fact #20 is a
    # kindest/node containerd behaviour (`LimitNOFILE=infinity`), and
    # scripts/node-nofile-fix.sh works around it against THIS node image.
    #
    # To move up: change both the tag and the digest together, recreate the
    # cluster, and re-run `make status` + `make smoke`.
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
