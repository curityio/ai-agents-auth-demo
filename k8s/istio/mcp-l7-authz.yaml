# Istio-native L7 authorization for the MCP servers (ambient waypoint).
#
# ztunnel is L4-only, so JWT validation + claim/identity-based authz requires an
# L7 waypoint Envoy. The mcp-ops / mcp-observability Services opt in via the
# `istio.io/use-waypoint: mcp-waypoint` label (see k8s/workloads/mcp-*.yaml). This
# is TRANSPARENT — agents keep calling mcp-*.mcp.svc:8080/mcp unchanged.
#
# Scope of enforcement here is COARSE early-deny: valid Curity JWT + expected
# caller SPIFFE identity + audience (+ scope where the claim shape allows). The
# AUTHORITATIVE fine-grained checks (exact `act` actor-chain, RFC 9470 step-up)
# stay in the resource-server middleware — Istio denies with a generic 403 and
# cannot emit the `WWW-Authenticate: insufficient_user_authentication` challenge
# the step-up flow depends on, nor match the nested `act.act.sub` chain.
#
# NOTE: Istio AuthorizationPolicy cannot read the JSON-RPC body, so it cannot gate
# by MCP tool name. That is acceptable because each MCP server is single-tier
# (mcp-ops = write, mcp-observability = read), so per-service ≈ per-tool here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-waypoint
  namespace: mcp
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# Validate the Curity-issued JWT at the waypoint.
#
# istiod (not the Envoy proxy) fetches `jwksUri`, and istiod can't resolve
# curity.localtest.me (it maps to its own pod — same loopback foot-gun as #5). So
# `jwksUri` targets Curity's in-cluster Service DNS (which istiod CAN resolve) over
# its plain-HTTP runtime listener (Curity runs HTTP behind the TLS-terminating edge
# — see k8s/curity/configmap.yaml + gateway-edge.yaml). `issuer` is independent of
# `jwksUri`, so it keeps the public URL the token's `iss` claim carries. istiod
# refreshes the keys automatically, so Curity key rotation needs no manual step.
#
# RequestAuthentication only VALIDATES a token when present; it never denies on
# its own. The AuthorizationPolicies below provide the actual default-deny.
# `forwardOriginalToken: true` is mandatory — otherwise Istio strips the Bearer
# after validation and the resource-server middleware (act-chain + step-up) breaks.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: curity-jwt
  namespace: mcp
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: mcp-waypoint
  jwtRules:
    - issuer: "https://curity.localtest.me/oauth/v2/oauth-anonymous"
      forwardOriginalToken: true
      jwksUri: "http://curity.curity.svc.cluster.local:8443/oauth/v2/oauth-anonymous/jwks"
---
# mcp-ops (privileged write tier): allow only the agent-specialist workload
# identity, with an mcp-ops-audience token, to POST /mcp. Unauthenticated GETs to
# the health probe and RFC 9728 metadata are allowed so they aren't 403'd.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mcp-ops-authz
  namespace: mcp
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: mcp-ops
  action: ALLOW
  rules:
    - to:
        # Unauthenticated demo-visibility + probe endpoints (open before the
        # waypoint existed): health, RFC 9728 metadata, the SPIFFE-id panel, and
        # the OBO-chain `/last-token` view (which keeps its own app-level auth).
        - operation:
            methods: ["GET"]
            paths: ["/healthz", "/.well-known/*", "/spiffe-id", "/last-token"]
    - from:
        - source:
            principals: ["cluster.local/ns/agents/sa/agent-specialist"]
      to:
        - operation:
            methods: ["POST"]
            paths: ["/mcp"]
      when:
        - key: request.auth.audiences
          values: ["mcp-ops"]
        # Scope check is kept narrow; if Curity emits `scope` as a space-delimited
        # multi-value string this exact-match won't fire — verified against a live
        # token, drop this clause and rely on audience+identity if so.
        - key: request.auth.claims[scope]
          values: ["ops:write"]
---
# mcp-observability (read tier): allow the agent-copilot and agent-specialist
# workload identities, with an mcp-observability-audience token, to POST /mcp.
# The specialist reads deployment state via this tier before executing writes.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mcp-observability-authz
  namespace: mcp
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: mcp-observability
  action: ALLOW
  rules:
    - to:
        # Unauthenticated demo-visibility + probe endpoints (open before the
        # waypoint existed): health, RFC 9728 metadata, the SPIFFE-id panel, and
        # the OBO-chain `/last-token` view (which keeps its own app-level auth).
        - operation:
            methods: ["GET"]
            paths: ["/healthz", "/.well-known/*", "/spiffe-id", "/last-token"]
    - from:
        - source:
            principals:
              - "cluster.local/ns/agents/sa/agent-copilot"
              - "cluster.local/ns/agents/sa/agent-specialist"
      to:
        - operation:
            methods: ["POST"]
            paths: ["/mcp"]
      when:
        - key: request.auth.audiences
          values: ["mcp-observability"]
        - key: request.auth.claims[scope]
          values: ["obs:read"]
