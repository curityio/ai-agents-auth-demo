apiVersion: v1
kind: ServiceAccount
metadata:
  name: inspect-api
  namespace: apis
---
# Read capability for the inspect path. Least privilege —
# get/list pods + read pod logs, prod namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inspect-api-read
  namespace: prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inspect-api-read
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: inspect-api
    namespace: apis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inspect-api-read
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inspect-api-spiffe-helper
  namespace: apis
data:
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cmd = ""
    cmd_args = ""
    daemon_mode = true
    jwt_svids = [
      {
        jwt_audience = "https://curity.localtest.me/oauth/v2/oauth-token"
        jwt_svid_file_name = "/run/spiffe/curity-actor.jwt"
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspect-api
  namespace: apis
  labels:
    app: inspect-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: inspect-api }
  template:
    metadata:
      labels: { app: inspect-api }
    spec:
      serviceAccountName: inspect-api
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-svids
          emptyDir:
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: inspect-api-spiffe-helper
      containers:
        - name: api
          image: ai-agents-demo/inspect-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: spiffe-svids
              mountPath: /run/spiffe
              readOnly: true
          env:
            - name: PORT
              value: "8084"
            - name: CURITY_ISSUER
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous
            - name: CURITY_JWKS_URI
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous/jwks
            - name: EXPECTED_AUDIENCE
              value: inspect-api
            - name: REQUIRED_SCOPES
              value: inspect:read
            - name: TARGET_NAMESPACE
              value: prod
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.telemetry.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: inspect-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apis
            - name: SPIFFE_SVID_PATH
              value: /run/spiffe/curity-actor.jwt
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe-helper/spiffe-helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-svids
              mountPath: /run/spiffe
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: inspect-api
  namespace: apis
  labels:
    # Route Service traffic through the apis-waypoint Envoy so its
    # AuthorizationPolicy (k8s/istio/apis-l7-authz.yaml) is enforced.
    istio.io/use-waypoint: apis-waypoint
spec:
  selector:
    app: inspect-api
  ports:
    - name: http
      port: 8084
      targetPort: 8084
