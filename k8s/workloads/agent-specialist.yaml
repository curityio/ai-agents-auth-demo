apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-specialist
  namespace: agents
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-specialist-spiffe-helper
  namespace: agents
data:
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cmd = ""
    cmd_args = ""
    daemon_mode = true
    jwt_svids = [
      {
        jwt_audience = "https://curity.localtest.me/oauth/v2/oauth-token"
        jwt_svid_file_name = "/run/spiffe/curity-actor.jwt"
      }
    ]
---
# NOTE: `agent-specialist-curity` Secret is created out-of-band via
# `make seed-specialist-key`. Holds `CURITY_AGENT_PRIVATE_KEY_PEM` — the PKCS8
# private key this agent uses to sign its private_key_jwt client assertion when
# authenticating to Curity's /token endpoint as a CIMD ephemeral client.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-specialist
  namespace: agents
  labels:
    app: agent-specialist
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent-specialist }
  template:
    metadata:
      labels: { app: agent-specialist }
    spec:
      serviceAccountName: agent-specialist
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-svids
          emptyDir:
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: agent-specialist-spiffe-helper
      containers:
        - name: agent
          image: ai-agents-demo/agent-specialist:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: spiffe-svids
              mountPath: /run/spiffe
              readOnly: true
          env:
            - name: PORT
              value: "8082"
            - name: CURITY_ISSUER
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous
            - name: CURITY_JWKS_URI
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous/jwks
            - name: AGENT_AUDIENCE
              value: agent-specialist
            # CIMD client_id — the HTTPS URL Curity dereferences for this agent's
            # metadata document. Must match the CLIENT_POLICY key in token-exchange.js.
            - name: AGENT_CLIENT_ID
              value: https://specialist.localtest.me/.well-known/oauth-client
            # Both MCP paths route through the agentgateway MCP front door, by its
            # PUBLIC name. The agent is a spec-shaped MCP client: it learns the
            # authorization server from each URL's 401 → RFC 9728 → RFC 8414 chain,
            # and RFC 9728 requires the document's `resource` to equal the URL the
            # client uses — which is why this is the edge host
            # (scripts/cluster-routing.sh aliases it into the pod) and not the
            # in-cluster Service name. The gateway validates aud=mcp-gateway and
            # re-exchanges per tool-target to the narrowed backend audience
            # (mcp-ops / mcp-inspect) via the co-located exchange-shim.
            # Re-run MCP authorization discovery (401 → RFC 9728 → RFC 8414) on EVERY
            # question instead of caching it 10 min: this demo exists to show that chain
            # in the trace and the OBO log. Costs ~3 small requests per question.
            - name: MCP_DISCOVERY_TTL_SECONDS
              value: "0"
            # Likewise for this agent's exchange caches (MCP, LLM, A2A tokens): re-mint
            # on every question so each trace shows its RFC 8693 exchanges. With the
            # 60 s code default a second question within a minute showed none.
            - name: TOKEN_EXCHANGE_CACHE_TTL_SECONDS
              value: "0"
            - name: MCP_OPS_URL
              value: https://mcp-gateway.localtest.me/ops/mcp
            # The one static per-server value: the RFC 8693 audience (logical name).
            # Replaced by RFC 8707 resource once Curity supports it.
            - name: MCP_OPS_AUDIENCE
              value: mcp-gateway
            - name: MCP_INSPECT_URL
              value: https://mcp-gateway.localtest.me/inspect/mcp
            # The one static per-server value: the RFC 8693 audience (logical name).
            # Replaced by RFC 8707 resource once Curity supports it.
            - name: MCP_INSPECT_AUDIENCE
              value: mcp-gateway
            - name: REQUIRED_ACR
              value: mfa
            # Identity-bound LLM egress: routed through the agentgateway `/llm`
            # route (mcp ns). The agent exchanges the caller's user token for an
            # aud=llm-gateway, scope=llm:invoke token (RFC 8693) and presents it
            # as the bearer; the gateway swaps in the real upstream API key
            # before forwarding. See llm-token.ts.
            - name: LLM_GATEWAY_URL
              value: http://agentgateway.mcp.svc.cluster.local:8080/llm
            - name: LLM_GATEWAY_AUDIENCE
              value: llm-gateway
            - name: LLM_GATEWAY_SCOPE
              value: llm:invoke
            - name: PUBLIC_BASE_URL
              value: https://specialist.localtest.me
            # OTel: export to the Collector (OTLP/HTTP); spiffe.id read from the
            # SVID file at SPIFFE_SVID_PATH by otel-bootstrap at SDK init.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.telemetry.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: agent-specialist
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agents
            - name: SPIFFE_SVID_PATH
              value: /run/spiffe/curity-actor.jwt
          envFrom:
            - secretRef:
                name: agent-specialist-curity
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe-helper/spiffe-helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-svids
              mountPath: /run/spiffe
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          # UID-1000 rationale: matches the `node` user in the main container's
          # base image so the SVID file (mode 0600 from spiffe-helper) is
          # readable. See agent-copilot.yaml for the longer story.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: agent-specialist
  namespace: agents
spec:
  selector:
    app: agent-specialist
  ports:
    - name: http
      port: 8082
      targetPort: 8082
