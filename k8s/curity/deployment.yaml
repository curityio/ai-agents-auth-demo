apiVersion: v1
kind: ServiceAccount
metadata:
  name: curity
  namespace: curity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curity
  namespace: curity
  labels:
    app: curity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curity
  template:
    metadata:
      labels:
        app: curity
    spec:
      serviceAccountName: curity
      # The idsvr image runs as idsvr (uid 10001, gid 10000); an emptyDir is root-owned,
      # so without fsGroup the init container cannot write the seeded DB into it.
      securityContext:
        fsGroup: 10000
      # Seed alice/bob/carol (+ TOTP) into the file-based HSQLDB BEFORE idsvr opens it.
      # The image ships a pristine schema-complete DB at /opt/idsvr/var/db; the init
      # container copies it into the `db` emptyDir, INSERTs the persona rows with the
      # bundled hsqltool, and exits. Inputs come from the curity-demo-users Secret
      # (`make seed-users`); the script from the curity-users-init-script ConfigMap
      # (`make apply`, from scripts/curity-users-init.sh). Same image → same uid, so
      # the files are owned by idsvr. A restart re-runs it with the SAME secrets.
      initContainers:
        - name: seed-users
          image: curity.azurecr.io/curity/idsvr:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/curity-users-init.sh"]
          envFrom:
            - secretRef:
                name: curity-demo-users
          volumeMounts:
            - name: db
              mountPath: /seed
            - name: seed-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: idsvr
          # Pin to a known-good Curity Identity Server image in your seed step.
          # Public images are not freely pullable; check Curity's docs for access.
          image: curity.azurecr.io/curity/idsvr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: admin
              containerPort: 6749
            - name: oauth
              containerPort: 8443
          env:
            - name: ADMIN
              value: "true"
            - name: LOGGING_LEVEL
              value: DEBUG
          volumeMounts:
            - name: db
              mountPath: /opt/idsvr/var/db
            - name: config
              mountPath: /opt/idsvr/etc/init/curity-config.xml
              subPath: curity-config.xml
              readOnly: true
            - name: license
              mountPath: /opt/idsvr/etc/init/license/license.json
              subPath: license.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: db
          emptyDir: {}
        - name: seed-script
          configMap:
            name: curity-users-init-script
        - name: config
          configMap:
            name: curity-config
        - name: license
          secret:
            secretName: curity-license
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: curity
  namespace: curity
spec:
  selector:
    app: curity
  ports:
    - name: oauth
      port: 8443
      targetPort: 8443
    - name: admin
      port: 6749
      targetPort: 6749
