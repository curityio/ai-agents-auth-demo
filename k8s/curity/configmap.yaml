            <endpoint>
              <id>token-service-introspect</id>
              <uri>/oauth/v2/oauth-introspect</uri>
              <endpoint-kind>oauth-introspect</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-revoke</id>
              <uri>/oauth/v2/oauth-revoke</uri>
              <endpoint-kind>oauth-revoke</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-session</id>
              <uri>/oauth/v2/oauth-session</uri>
              <endpoint-kind>oauth-session</endpoint-kind>
            </endpoint>
            <endpoint>
              <id>token-service-token</id>
              <uri>/oauth/v2/oauth-token</uri>
              <endpoint-kind>oauth-token</endpoint-kind>
              <token-endpoint-procedures>
                <flow>oauth-token-authorization-code</flow>
                <procedure>acr-passthrough</procedure>
              </token-endpoint-procedures>
              <token-endpoint-procedures>
                <flow>oauth-token-oauth-token-exchange</flow>
                <procedure>spiffe-actor-validation</procedure>
              </token-endpoint-procedures>
            </endpoint>
            <endpoint>
              <id>token-service-userinfo</id>
              <uri>/oauth/v2/oauth-userinfo</uri>
              <endpoint-kind>oauth-userinfo</endpoint-kind>
            </endpoint>
          </endpoints>
          <token-issuers>
            <default-token-issuer>
              <jwt-issuer-settings>
                <signing-key-id>default-signing-key</signing-key-id>
              </jwt-issuer-settings>
              <access-token-as-jwt/>
              <default-data-source>default-datasource</default-data-source>
            </default-token-issuer>
          </token-issuers>
        </profile>
      </profiles>
      <facilities xmlns="https://curity.se/ns/conf/base">
        <http>
        <!-- Used by the ephemeral-client (CIMD) feature to dereference each agent's
               client_id URL over HTTPS. Hostname verification stays ON (the gateway
               cert SANs match copilot/specialist.localtest.me); trust anchors come from
               the crypto server-truststore (the mkcert root CA, embedded below). -->
          <client>
            <id>cimd-fetch</id>
            <tls>
              <use-truststore>true</use-truststore>
            </tls>
          </client>
          <client>
            <id>http-client-spiffe</id>
            <tls>
              <disable-hostname-verification>true</disable-hostname-verification>
              <use-truststore>true</use-truststore>
            </tls>
          </client>
        </http>
