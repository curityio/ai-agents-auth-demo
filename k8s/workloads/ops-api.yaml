apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-api
  namespace: apis
---
# The privileged K8s capability lives here, not in mcp-ops. The audience-
# changing exchange (mcp-ops → ops-api) is the auth boundary; this Role is the
# platform-layer half of defense in depth — restart only, prod ns only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-api-restart
  namespace: prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-api-restart
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: ops-api
    namespace: apis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-api-restart
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-api-spiffe-helper
  namespace: apis
data:
  # ops-api is a TERMINAL resource server (it never exchanges), so this SVID is
  # used only for the spiffe.id trace attribute (otel-bootstrap) and mesh mTLS.
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cmd = ""
    cmd_args = ""
    daemon_mode = true
    jwt_svids = [
      {
        jwt_audience = "https://curity.localtest.me/oauth/v2/oauth-token"
        jwt_svid_file_name = "/run/spiffe/curity-actor.jwt"
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-api
  namespace: apis
  labels:
    app: ops-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: ops-api }
  template:
    metadata:
      labels: { app: ops-api }
    spec:
      serviceAccountName: ops-api
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-svids
          emptyDir:
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: ops-api-spiffe-helper
      containers:
        - name: api
          image: ai-agents-demo/ops-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          volumeMounts:
            - name: spiffe-svids
              mountPath: /run/spiffe
              readOnly: true
          env:
            - name: PORT
              value: "8083"
            - name: CURITY_ISSUER
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous
            - name: CURITY_JWKS_URI
              value: https://curity.localtest.me/oauth/v2/oauth-anonymous/jwks
            - name: EXPECTED_AUDIENCE
              value: ops-api
            - name: REQUIRED_SCOPES
              value: ops:write
            - name: REQUIRED_ACR
              value: mfa
            - name: TARGET_NAMESPACE
              value: prod
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.telemetry.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: ops-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apis
            - name: SPIFFE_SVID_PATH
              value: /run/spiffe/curity-actor.jwt
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/etc/spiffe-helper/spiffe-helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-svids
              mountPath: /run/spiffe
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: ops-api
  namespace: apis
  labels:
    # Route Service traffic through the apis-waypoint Envoy so its
    # AuthorizationPolicy (k8s/istio/apis-l7-authz.yaml) is enforced.
    istio.io/use-waypoint: apis-waypoint
spec:
  selector:
    app: ops-api
  ports:
    - name: http
      port: 8083
      targetPort: 8083
